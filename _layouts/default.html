<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>

    {% include meta.html %}

    <link rel="stylesheet" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  </head>

  <body class="theme-dark">
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead">
          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
          </div>

          <nav>
            <a href="{{ site.baseurl }}/categories">Categories</a>
            <a href="{{ site.baseurl }}/feedback">Feedback</a>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch theme">Light</button>
          </nav>
        </header>
      </div>
    </div>

    <main class="container">
      {{ content }}
    </main>

    <div class="wrapper-footer">
      <div class="container">
        <footer>
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    <script>
      (function () {
        var storageKey = "site-theme";
        var body = document.body;
        var toggle = document.getElementById("theme-toggle");

        function applyTheme(theme) {
          var isLight = theme === "light";
          body.classList.toggle("theme-light", isLight);
          body.classList.toggle("theme-dark", !isLight);

          if (toggle) {
            toggle.textContent = isLight ? "Dark" : "Light";
            toggle.setAttribute("aria-label", isLight ? "Switch to dark theme" : "Switch to light theme");
          }
        }

        var savedTheme = "dark";
        try {
          savedTheme = localStorage.getItem(storageKey) || "dark";
        } catch (e) {
          savedTheme = "dark";
        }

        applyTheme(savedTheme);

        if (toggle) {
          toggle.addEventListener("click", function () {
            var nextTheme = body.classList.contains("theme-light") ? "dark" : "light";
            try {
              localStorage.setItem(storageKey, nextTheme);
            } catch (e) {
              // Ignore storage failures and still apply the theme.
            }
            applyTheme(nextTheme);
          });
        }
      })();
    </script>
  </body>
</html>
